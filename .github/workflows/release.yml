name: Release

# Public releases only: push a tag such as v1.0.0 (see "Releasing" in the README).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check

      - name: Tag must match the manifest version
        run: |
          version="v$(node -p "require('./src/manifest.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi

      - name: Build extension zip
        run: npm run build

      - name: Release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > dist/RELEASE_NOTES.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/glasstube-*.zip \
            --title "GlassTube $GITHUB_REF_NAME" \
            --notes-file dist/RELEASE_NOTES.md \
            --verify-tag
