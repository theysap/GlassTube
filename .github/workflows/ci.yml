name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test & build
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint (ESLint, Stylelint, Prettier)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Validate manifest, versions and changelog
        run: npm run validate

      - name: Commit message convention
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/check-history.mjs "origin/${{ github.base_ref }}..HEAD"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] &&
            git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            node scripts/check-history.mjs "${{ github.event.before }}..${{ github.sha }}"
          else
            # First push, or a force-push whose previous head is gone: check the whole history.
            node scripts/check-history.mjs "${{ github.sha }}"
          fi

      # The zip is built only to prove the package assembles; it is never published from CI —
      # store zips are produced locally for the Chrome Web Store (npm run release:local).
      - name: Build check
        run: npm run build
