name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test & build
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint (ESLint, Stylelint, Prettier)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Validate manifest, versions and changelog
        run: npm run validate

      - name: Commit message convention
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/check-history.mjs "origin/${{ github.base_ref }}..HEAD"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            node scripts/check-history.mjs "${{ github.event.before }}..${{ github.sha }}"
          fi

      - name: Build extension zip
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: glasstube-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
