<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    GlassTube logo — a Liquid Glass screen floating over a lavender-to-indigo field.
    Drawn on a 1024 grid; rendered up to 4096 px by scripts/generate-assets.mjs.
  -->
  <defs>
    <!-- Background field -->
    <linearGradient id="field" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#8C7BFF"/>
      <stop offset="0.45" stop-color="#5A3FD1"/>
      <stop offset="1" stop-color="#1B1147"/>
    </linearGradient>
    <radialGradient id="bloomWarm" cx="0.82" cy="0.86" r="0.55">
      <stop offset="0" stop-color="#FF7AB6" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#C04FD8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#C04FD8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloomCool" cx="0.12" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#9EE7FF" stop-opacity="0.75"/>
      <stop offset="0.6" stop-color="#7C8BFF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#7C8BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fieldSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="0" y="0" width="1024" height="1024" rx="232"/>
    </clipPath>

    <!-- Glass screen -->
    <linearGradient id="glassFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.46"/>
      <stop offset="0.42" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.26"/>
    </linearGradient>
    <linearGradient id="glassRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="0.7" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="glassGlint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="screen">
      <rect x="150" y="262" width="724" height="500" rx="118"/>
    </clipPath>
    <filter id="frost" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="34"/>
      <feOffset dy="40"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Play glyph -->
    <linearGradient id="playFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDE8FF"/>
    </linearGradient>
    <filter id="playShadow" x="-40%" y="-40%" width="180%" height="190%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dy="14"/>
      <feFlood flood-color="#2A1680" flood-opacity="0.55"/>
      <feComposite operator="in" in2="SourceAlpha"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="url(#field)"/>
    <rect width="1024" height="1024" fill="url(#bloomCool)"/>
    <rect width="1024" height="1024" fill="url(#bloomWarm)"/>
    <rect width="1024" height="560" fill="url(#fieldSheen)"/>

    <!-- The screen: frosted glass with the field blurred behind it -->
    <g filter="url(#shadow)">
      <g clip-path="url(#screen)">
        <g filter="url(#frost)">
          <rect width="1024" height="1024" fill="url(#field)"/>
          <circle cx="300" cy="330" r="220" fill="#B9F0FF" opacity="0.7"/>
          <circle cx="800" cy="760" r="260" fill="#FF8AC2" opacity="0.75"/>
          <circle cx="620" cy="420" r="160" fill="#9C8CFF" opacity="0.8"/>
        </g>
        <rect x="150" y="262" width="724" height="500" fill="url(#glassFill)"/>
        <path d="M150 262h724v170C700 380 420 360 150 470z" fill="url(#glassGlint)" opacity="0.7"/>
      </g>
      <rect x="150" y="262" width="724" height="500" rx="118" fill="none" stroke="url(#glassRim)" stroke-width="10"/>
    </g>

    <!-- Play -->
    <path
      d="M452 406c0-22 24-36 43-24l170 106c18 11 18 37 0 48L495 642c-19 12-43-2-43-24z"
      fill="url(#playFill)"
      filter="url(#playShadow)"
    />
  </g>

  <!-- Hairline edge so the icon reads on light and dark backgrounds -->
  <rect x="2" y="2" width="1020" height="1020" rx="230" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="4"/>
</svg>
